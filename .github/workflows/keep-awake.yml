name: Keep the online tool awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 https://v9-tools.onrender.com/ -o /dev/null
